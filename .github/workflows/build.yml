name: Build Garden Work Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ZIP="GardenWorkTracker-CUSTOMER-HOURS-FIXED.zip"

          echo "Looking for: $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            ls -la
            exit 1
          fi

          echo "ZIP FOUND"
          unzip -t "$ZIP"

      - name: Extract project
        run: |
          rm -rf GardenWorkTracker_Finished
          mkdir GardenWorkTracker_Finished
          unzip -q "GardenWorkTracker-CUSTOMER-HOURS-FIXED.zip" -d GardenWorkTracker_Finished

          echo "Project contents:"
          find GardenWorkTracker_Finished -maxdepth 3 -type f | sort

      - name: Check Android project
        run: |
          test -d GardenWorkTracker_Finished/app

          if [ -f GardenWorkTracker_Finished/settings.gradle ]; then
            echo "settings.gradle found"
          elif [ -f GardenWorkTracker_Finished/settings.gradle.kts ]; then
            echo "settings.gradle.kts found"
          else
            echo "ERROR: Android project settings file missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find GardenWorkTracker_Finished -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi

          echo "APK: $APK"
          cp "$APK" GardenWorkTracker-CUSTOMER-HOURS-FIXED-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-CUSTOMER-HOURS-FIXED-APK
          path: GardenWorkTracker-CUSTOMER-HOURS-FIXED-APK.apk
          if-no-files-found: error
