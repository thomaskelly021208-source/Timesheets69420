name: Build Garden Work Tracker - Update Safe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and verify app ZIP
        run: |
          ZIP="GardenWorkTracker-UPDATE-SAFE.zip"

          echo "Repository contents:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo "ZIP files actually present:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          unzip -t "$ZIP"

      - name: Extract app
        run: |
          rm -rf GardenWorkTracker_Finished
          mkdir GardenWorkTracker_Finished
          unzip -o GardenWorkTracker-UPDATE-SAFE.zip -d GardenWorkTracker_Finished

      - name: Check Android project
        run: |
          test -f GardenWorkTracker_Finished/settings.gradle
          test -d GardenWorkTracker_Finished/app

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: GardenWorkTracker_Finished
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-UPDATE-SAFE-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/release/app-release.apk
