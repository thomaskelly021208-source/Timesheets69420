name: Build Garden Work Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o GardenWorkTracker-UPLOAD-TO-APK-BUILDER.zip

      - name: Fix Android source
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("GardenWorkTracker_Finished/app/src/main/java/com/gardenworktracker/MainActivity.java")
          s = p.read_text()

          # Fix missing File import
          if "import java.io.File;" not in s:
              s = s.replace(
                  "import java.util.*;",
                  "import java.util.*;import java.io.File;"
              )

          # Fix Android 15 edge-to-edge layout.
          old = "setContentView(root);work();"

          new = """setContentView(root);
          if (Build.VERSION.SDK_INT >= 21) {
              root.setOnApplyWindowInsetsListener((v, insets) -> {
                  android.graphics.Insets bars =
                      insets.getInsets(android.view.WindowInsets.Type.systemBars());
                  v.setPadding(0, bars.top, 0, bars.bottom);
                  return insets;
              });
              root.requestApplyInsets();
          }
          work();"""

          if old in s:
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/debug/app-debug.apk
