name: Build Garden Work Tracker — Fixed UI + Rolling Sheets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract fixed Garden Work Tracker
        run: |
          rm -rf GardenWorkTracker_Finished
          unzip -o GardenWorkTracker-ROLLING-SHEETS-UI-FIXED.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Fixed UI APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-FIXED-UI-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/debug/app-debug.apk
