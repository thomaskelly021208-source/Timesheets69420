name: Build Garden Work Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o GardenWorkTracker-UPLOAD-TO-APK-BUILDER.zip
          ls -la GardenWorkTracker_Finished

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/debug/app-debug.apk
