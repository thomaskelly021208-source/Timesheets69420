name: Build Garden Work Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract REAL FIX
        run: |
          rm -rf GardenWorkTracker_Finished
          unzip -o GardenWorkTracker-REAL-FIX.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: gradle assembleDebug --no-daemon

      - name: Upload REAL FIX APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-REAL-FIX-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/debug/app-debug.apk
