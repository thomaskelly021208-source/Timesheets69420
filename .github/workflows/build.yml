name: Build Garden Work Tracker — GPS Customer Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract updated app source
        run: |
          rm -rf GardenWorkTracker_Finished
          unzip -o GardenWorkTracker-GPS-CUSTOMER-FIX.zip -d GardenWorkTracker_Finished
          
          # If the ZIP already contains the project folder, move its contents up
          if [ -d "GardenWorkTracker_Finished/GardenWorkTracker_Finished" ]; then
            mv GardenWorkTracker_Finished/GardenWorkTracker_Finished/* GardenWorkTracker_Finished/
            mv GardenWorkTracker_Finished/GardenWorkTracker_Finished/.[!.]* GardenWorkTracker_Finished/ 2>/dev/null || true
            rm -rf GardenWorkTracker_Finished/GardenWorkTracker_Finished
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-GPS-CUSTOMER-FIX-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/debug/app-debug.apk
