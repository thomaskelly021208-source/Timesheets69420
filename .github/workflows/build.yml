name: Build Garden Work Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o GardenWorkTracker-UPLOAD-TO-APK-BUILDER.zip
          
          # Fix missing Java import in MainActivity
          sed -i 's/import java.util.\*;/import java.util.*;import java.io.File;/' \
            GardenWorkTracker_Finished/app/src/main/java/com/gardenworktracker/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GardenWorkTracker_Finished
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenWorkTracker-APK
          path: GardenWorkTracker_Finished/app/build/outputs/apk/debug/app-debug.apk
